# Build the release bundle (.aab) and hand it to the store.
#
# Why a bundle and not an APK: the store signs and splits the upload itself, so the
# app never needs its release keystore in CI. The bundle is built with a throwaway
# keystore (which only satisfies Gradle's signing config and is discarded), posted to
# the store's upload API, and re-signed there before the release goes live.
#
# The upload only runs on main, and only when the repository variable AUTO_RELEASE is
# "true", so a merge builds and checks the bundle without shipping it. A manual run
# can force it with dry_run=false.
#
# Repository variables: ZEALOT_URL, ZEALOT_CHANNEL_KEY, AUTO_RELEASE
# Repository secret:    ZEALOT_APP_TOKEN
name: Release AAB

on:
  push:
    branches: [main]
    paths:
      - "base/app/**"
      - "base/host-android/**"
      - "base/extensions/**"
      - "base/api-spotify/**"
      - "base/build.gradle.kts"
      - "base/settings.gradle.kts"
      - "base/gradle.properties"
      - "base/gradle/**"
      - "base/gradlew"
      - ".github/workflows/release-aab.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = build and check only; false = also upload to the store (main only)"
        type: boolean
        default: true

concurrency:
  group: release-aab
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: base

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.plan.outputs.release }}
      publish: ${{ steps.plan.outputs.publish }}
      code: ${{ steps.plan.outputs.code }}
      name: ${{ steps.plan.outputs.name }}
      bundle_id: ${{ steps.plan.outputs.bundle_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Decide
        id: plan
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          AUTO_RELEASE: ${{ vars.AUTO_RELEASE }}
          ZEALOT_URL: ${{ vars.ZEALOT_URL }}
          ZEALOT_CHANNEL_KEY: ${{ vars.ZEALOT_CHANNEL_KEY }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # The version name is the default in base/app/build.gradle.kts
          # (val version = (findProperty("appVersionName") as String?) ?: "2.3.0").
          name=$(grep -m1 -oP 'findProperty\("appVersionName"\) as String\?\) \?: "\K[^"]+' base/app/build.gradle.kts || true)
          [ -n "$name" ] || fail "could not read the default version name from base/app/build.gradle.kts"
          # The file's versionCode is a fixed fallback (200); CI passes its own so each
          # release is unique and monotonic, exactly like the APK release job (1000 + run).
          code=$((1000 + GITHUB_RUN_NUMBER))
          # Releases are the stable channel (no "-beta"), i.e. applicationId app.myspoti.stable.
          bundle_id="app.myspoti.stable"

          release=true
          publish=false
          note=""
          if [ "$REF" != "refs/heads/main" ]; then
            note="${REF#refs/heads/} is not main: the bundle is built and checked, nothing is uploaded"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$INPUT_DRY_RUN" = "false" ]; then publish=true; else note="dry run: nothing is uploaded"; fi
          elif [ "$AUTO_RELEASE" = "true" ]; then
            publish=true
          else
            note="repository variable AUTO_RELEASE is not 'true': nothing is uploaded"
          fi

          # The channel key is the duplicate guard: it needs no token and answers 404 when
          # the store does not yet hold this exact version. The store sleeps on its free
          # plan, so the first request of the day can take minutes or answer 502 while it
          # wakes: wake it, retry, and treat a wake-up failure as "not published yet"
          # rather than blocking the build. The upload itself is the authority on
          # duplicates, so a wrong guess here cannot double-publish.
          if [ "$publish" = "true" ]; then
            [ -n "${ZEALOT_URL:-}" ] || fail "repository variable ZEALOT_URL is not set"
            [ -n "${ZEALOT_CHANNEL_KEY:-}" ] || fail "repository variable ZEALOT_CHANNEL_KEY is not set"
            base="${ZEALOT_URL%/}"
            echo "waking the store (it sleeps on the free plan)..."
            curl -sS -o /dev/null -w 'wake-up: %{http_code}\n' --max-time 300 \
              "$base/api/apps/version_exist" || echo "wake-up request did not finish; continuing"
            status=""
            for attempt in 1 2 3 4 5; do
              status=$(curl -sS -G -o "$RUNNER_TEMP/exist.json" -w '%{http_code}' \
                --max-time 180 \
                --data-urlencode "channel_key=$ZEALOT_CHANNEL_KEY" \
                --data-urlencode "bundle_id=$bundle_id" \
                --data-urlencode "release_version=$name" \
                --data-urlencode "build_version=$code" \
                "$base/api/apps/version_exist") || status=000
              case "$status" in
                200|404) break;;
              esac
              echo "the store answered $status on attempt $attempt; retrying in 20s"
              sleep 20
            done
            case "$status" in
              200) release=false; note="the store already holds $name ($code)";;
              404) ;;
              *) echo "::warning::the store could not confirm whether $name ($code) exists; publishing anyway"
                 release=true;;
            esac
          fi

          {
            echo "release=$release"; echo "publish=$publish"
            echo "code=$code"; echo "name=$name"; echo "bundle_id=$bundle_id"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::release=$release publish=$publish version=$name code=$code${note:+; $note}"

  build:
    name: Build
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      # The store re-signs, so the bundle only has to satisfy Gradle. A throwaway
      # keystore keeps the release signing config valid without shipping a real key.
      - name: Provide a throwaway signing key
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore release.keystore -storepass throwaway -keypass throwaway \
            -alias throwaway -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CI Throwaway,O=Spotifai,C=US"

      - name: Build the release bundle
        env:
          MYSPOTI_KEYSTORE: ${{ github.workspace }}/base/release.keystore
          MYSPOTI_KEYSTORE_PASSWORD: throwaway
          MYSPOTI_KEY_ALIAS: throwaway
          MYSPOTI_KEY_PASSWORD: throwaway
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain :app:bundleRelease \
            -PappVersionName="${{ needs.plan.outputs.name }}" \
            -PappVersionCode="${{ needs.plan.outputs.code }}" \
            -PupdateRepo="${{ github.repository }}"

      - name: Check the bundle
        id: aab
        run: |
          set -euo pipefail
          dir=app/build/outputs/bundle/release
          ls -l "$dir"
          shopt -s nullglob
          files=("$dir"/*.aab)
          [ "${#files[@]}" -eq 1 ] || { echo "::error::expected exactly one .aab in $dir, found ${#files[@]}"; exit 1; }
          aab="${files[0]}"
          unzip -l "$aab" | grep -q ' base/manifest/AndroidManifest.xml$' \
            || { echo "::error::$aab has no base/manifest/AndroidManifest.xml"; exit 1; }
          echo "aab=$aab" >> "$GITHUB_OUTPUT"

      - name: Upload the bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: spotifai-aab
          path: base/${{ steps.aab.outputs.aab }}
          if-no-files-found: error

      - name: Hand the bundle to the store
        if: needs.plan.outputs.publish == 'true'
        env:
          ZEALOT_URL: ${{ vars.ZEALOT_URL }}
          ZEALOT_CHANNEL_KEY: ${{ vars.ZEALOT_CHANNEL_KEY }}
          ZEALOT_APP_TOKEN: ${{ secrets.ZEALOT_APP_TOKEN }}
          AAB: ${{ steps.aab.outputs.aab }}
          NAME: ${{ needs.plan.outputs.name }}
          CODE: ${{ needs.plan.outputs.code }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ -n "${ZEALOT_URL:-}" ] || fail "ZEALOT_URL is not set"
          [ -n "${ZEALOT_CHANNEL_KEY:-}" ] || fail "ZEALOT_CHANNEL_KEY is not set"
          [ -n "${ZEALOT_APP_TOKEN:-}" ] || fail "secret ZEALOT_APP_TOKEN is not set"
          base="${ZEALOT_URL%/}"
          echo "::add-mask::$ZEALOT_APP_TOKEN"
          changelog="Version $NAME (build $CODE), commit ${GITHUB_SHA:0:7}."

          # The store sleeps on its free plan; wake it before the multipart POST so the
          # request does not spend its first minute waiting on the cold start.
          echo "waking the store before the upload..."
          curl -sS -o /dev/null -w 'wake-up: %{http_code}\n' --max-time 300 \
            "$base/api/apps/version_exist" || echo "wake-up request did not finish; continuing"

          # POST /api/apps/upload is a single multipart request: Zealot parses the
          # bundle, re-signs it with the organisation key and publishes the release.
          # It answers 201 with the release on success; 401 means the token is wrong.
          status=$(curl -sS -o "$RUNNER_TEMP/upload.json" -w '%{http_code}' --max-time 1500 \
            --retry 3 --retry-all-errors --retry-delay 10 \
            --form-string "token=$ZEALOT_APP_TOKEN" \
            --form-string "channel_key=$ZEALOT_CHANNEL_KEY" \
            --form-string "source=github-actions" \
            --form-string "git_commit=$GITHUB_SHA" \
            --form-string "branch=$GITHUB_REF_NAME" \
            --form-string "ci_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --form-string "changelog=$changelog" \
            -F "file=@$AAB" \
            "$base/api/apps/upload") || fail "the upload request failed"
          [ "$status" = "201" ] || { head -c 1500 "$RUNNER_TEMP/upload.json" || true; echo; fail "the store answered $status to the upload (201 expected)"; }

          rel=$(jq -r '.release_version // "?"' "$RUNNER_TEMP/upload.json")
          build=$(jq -r '.build_version // "?"' "$RUNNER_TEMP/upload.json")
          echo "::notice::the store published $rel ($build) for $ZEALOT_CHANNEL_KEY"
